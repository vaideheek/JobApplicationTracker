version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobtrack-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jobtrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - jobtrack_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  jobtrack_pgdata:
