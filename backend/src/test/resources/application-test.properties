spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep Flyway active to test migration compatibility
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# Local storage configuration for testing
app.storage.provider=local
jobtrack.upload-dir=target/test-uploads

# Test administration configurations
app.admin.email=admin@test.com
app.admin.password=password123
app.jwt.secret=dGVzdF9zZWNyZXRfZm9yX2xvY2FsX2RldmVsb3BtZW50X3Nob3VsZF9iZV9hdF9sZWFzdF8yNTZfYml0c19sb25n
app.jwt.expiration-minutes=60

# CORS settings for tests
app.cors.allowed-origins=http://localhost:5173
