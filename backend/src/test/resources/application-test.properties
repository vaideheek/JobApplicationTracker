spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep Flyway active to test migration compatibility
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# Local storage configuration for testing
app.storage.provider=local
jobtrack.upload-dir=target/test-uploads

# Test administration configurations
app.admin.username=owner
app.admin.password=password123
app.demo.username=demo
app.demo.password=password123

# CORS settings for tests
app.cors.allowed-origins=http://localhost:5173

# Hibernate Dialect for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
