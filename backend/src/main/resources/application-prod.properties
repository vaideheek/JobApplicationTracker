# Production configuration overrides
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Session settings for production (Secure and SameSite=None for cross-origin pages.dev -> render.com calls)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None

# Database connection pool settings (optimal for 512MB RAM instances)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Production Admin Credential Requirements (forces validation check failure if missing)
app.admin.username=${APP_ADMIN_USERNAME:${APP_ADMIN_EMAIL:}}
app.admin.password=${APP_ADMIN_PASSWORD:}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Error Response configuration - hide exception details in production
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging configurations
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# Production Disable Public Account Signup by Default
app.auth.signup-enabled=${AUTH_SIGNUP_ENABLED:false}

# Production Demo Account Overrides (requires APP_DEMO_PASSWORD to be explicitly configured to seed)
app.demo.username=${APP_DEMO_USERNAME:demo}
app.demo.password=${APP_DEMO_PASSWORD:}
