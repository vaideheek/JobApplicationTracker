# Application
spring.application.name=JobTrack

# Active profile: default is local (can be set to prod via SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtrack_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Server
server.port=${PORT:8080}

# Multipart File Upload Limits (Max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local storage configuration
jobtrack.upload-dir=${UPLOAD_DIR:../uploads}

# Security and JWT parameters (with local fallbacks)
app.admin.email=${APP_ADMIN_EMAIL:admin@jobtrack.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.jwt.secret=${APP_JWT_SECRET:dGVzdF9zZWNyZXRfZm9yX2xvY2FsX2RldmVsb3BtZW50X3Nob3VsZF9iZV9hdF9sZWFzdF8yNTZfYml0c19sb25n}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:480}

# Storage Provider settings
app.storage.provider=${APP_STORAGE_PROVIDER:local}

# R2 S3 Config (empty by default for local development)
r2.endpoint=${R2_ENDPOINT:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.region=${R2_REGION:auto}

# CORS configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
